<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compress Image Engine // FusionMint Laboratory</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/imageProcessCore/compress-image.css">
</head>
<body class="no-scrollbar text-slate-200 min-h-screen flex flex-col overflow-x-hidden pt-24">

    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-96 bg-gradient-to-b from-teal-500/5 to-transparent blur-3xl pointer-events-none"></div>

    <div class="fixed top-4 left-0 right-0 z-50 px-4 sm:px-6 lg:px-8 flex justify-center">
        <nav class="w-full max-w-7xl bg-slate-950/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl px-4 sm:px-6 py-3 flex items-center justify-between shadow-2xl shadow-slate-950/50">
            
            <div class="flex items-center gap-2.5 group cursor-pointer w-1/3 justify-start shrink-0">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-teal-500 to-emerald-400 flex items-center justify-center shadow-md shadow-teal-500/20 group-hover:rotate-180 transition-transform duration-700">
                    <i class="fa-solid fa-atom text-slate-950 text-sm animate-spin [animation-duration:16s]"></i>
                </div>
                <span class="text-base font-bold text-white tracking-tight hidden lg:inline">Fusion<span class="text-teal-400">Mint</span></span>
            </div>

            <div class="flex items-center justify-center w-1/3 shrink-0">
                <div class="flex items-center gap-1 bg-slate-900/40 p-1 rounded-xl border border-slate-800/40 shadow-inner">
                    <a href="../../index.html" class="hidden sm:inline px-3 py-1.5 text-xs font-medium text-slate-400 hover:text-white rounded-lg transition-colors">Home</a>
                    <a href="../../index.html#library" class="px-3 py-1.5 text-xs font-semibold text-teal-400 bg-teal-500/10 rounded-lg border border-teal-500/10 transition-all">Tools</a>
                    <a href="../navBar/about.html" class="hidden sm:inline px-3 py-1.5 text-xs font-medium text-slate-400 hover:text-white rounded-lg transition-colors">About</a>
                </div>
            </div>

            <div class="flex items-center justify-end w-1/3 shrink-0">
                <div class="flex items-center gap-1.5 text-[11px] font-medium text-slate-400 bg-slate-900/80 px-3 py-1.5 rounded-xl border border-slate-800/60 shadow-md">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="hidden sm:inline">Sandbox Active</span>
                    <span class="inline sm:hidden">Sandbox</span>
                </div>
            </div>

        </nav>
    </div>
    <main class="w-full max-w-[96%] mx-auto px-4 sm:px-6 lg:px-8 py-4 flex-1 relative z-10 merge-rules-container flex flex-col gap-4">
        
        <div class="w-full bg-slate-950/40 backdrop-blur-md border border-slate-800/60 rounded-2xl p-3 flex flex-col lg:flex-row items-center justify-between gap-4">
            
            <div class="flex items-center gap-3 w-full lg:w-auto relative min-h-[44px] px-4 border border-slate-800  bg-slate-900/20 rounded-xl hover:border-teal-500/30 transition-colors">
                <input type="file" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" id="media-drop-input" onchange="processImageStream(this)">
                
                <div id="upload-icon-logo" class="w-5 h-5 rounded bg-slate-900 flex items-center justify-center text-slate-400 text-[10px] border border-slate-800 shrink-0">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                
                <div class="text-xs font-semibold truncate max-w-full">
                    <span id="upload-text-prompt" class="text-slate-300 whitespace-nowrap">Select source graphic frame asset...</span>
                    <p id="staged-file-meta" class="text-[10px] font-mono text-teal-400 hidden truncate"></p>
                </div>
            </div>

            <div class="flex items-center gap-4 flex-1 w-full bg-slate-900/30 px-4 py-2 rounded-xl border border-slate-900">
                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500 whitespace-nowrap">Ratio Quality</span>
                <input type="range" min="5" max="100" value="80" class="w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-teal-400" id="compression-factor-range" oninput="updateIndicator(this.value)">
                <span id="slider-indicator" class="text-teal-400 font-mono text-xs font-bold min-w-[36px] text-right">80%</span>
            </div>

            <div class="flex items-center gap-2 w-full lg:w-auto">
                <button id="reset-btn" onclick="resetPipeline()" class="hidden px-4 py-2 border border-slate-800 bg-slate-900/40 hover:bg-slate-900 hover:text-white rounded-xl text-xs font-semibold text-slate-400 transition-colors cursor-pointer">Clear</button>
                <button onclick="executeLocalQuantization()" class="flex-1 lg:flex-initial px-5 py-2 bg-gradient-to-r from-teal-500 to-emerald-500 text-slate-950 font-extrabold text-xs uppercase tracking-widest rounded-xl shadow-md transition-all hover:from-teal-400 hover:to-emerald-400 active:scale-[0.97] cursor-pointer whitespace-nowrap">Mint <i class="fa-solid fa-bolt ml-0.5 text-[10px]"></i></button>
            </div>
        </div>

        <div id="preview-matrix-panel" class="flex-1 w-full bg-slate-950/20 border border-slate-900/60 rounded-3xl p-4 flex flex-col justify-center opacity-30 transition-all duration-300">
            <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-6 items-stretch">
                
                <div class="bg-slate-950/40 border border-slate-800/60 rounded-2xl p-4 min-h-[340px] sm:min-h-[480px] flex flex-col justify-between relative overflow-hidden">
                    <div class="flex justify-between items-center w-full mb-2 z-20">
                        <span class="text-[9px] uppercase font-bold tracking-widest bg-slate-950/90 text-slate-400 border border-slate-800 px-2.5 py-1 rounded-md">Original Frame</span>
                        <span id="original-size-badge" class="text-[10px] font-mono text-slate-400"></span>
                    </div>
                    <div class="w-full h-full flex flex-1 items-center justify-center overflow-hidden">
                        <img id="original-preview-img" class="max-w-full max-h-[45vh] md:max-h-[60vh] object-contain rounded-lg hidden shadow-2xl transition-all duration-300" alt="Original Data Matrix">
                    </div>
                </div>

                <div class="bg-slate-950/40 border-2 border-teal-500/10 rounded-2xl p-4 min-h-[340px] sm:min-h-[480px] flex flex-col justify-between relative overflow-hidden">
                    <div class="flex justify-between items-center w-full mb-2 z-20">
                        <span class="text-[9px] uppercase font-bold tracking-widest bg-teal-500/10 text-teal-400 border border-teal-500/20 px-2.5 py-1 rounded-md">Quantized Output</span>
                        <span id="compressed-size-badge" class="text-[10px] font-mono text-teal-400 font-bold"></span>
                    </div>
                    <div class="w-full h-full flex flex-1 items-center justify-center overflow-hidden">
                        <img id="compressed-preview-img" class="max-w-full max-h-[45vh] md:max-h-[60vh] object-contain rounded-lg hidden shadow-2xl transition-all duration-300" alt="Compressed Quantization Data Preview">
                    </div>
                </div>

            </div>
        </div>

    </main>

    <div id="matrix-processing-overlay" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[200] flex flex-col items-center justify-center gap-4 select-none">
        <div class="relative w-16 h-16 flex items-center justify-center">
            <div class="absolute inset-0 rounded-full border-4 border-t-teal-400 border-r-teal-500/10 border-b-teal-500/10 border-l-teal-500/10 animate-spin [animation-duration:1s]"></div>
            <div class="absolute w-10 h-10 rounded-full border-4 border-b-emerald-400 border-t-emerald-500/10 border-r-emerald-500/10 border-l-emerald-500/10 animate-spin [animation-direction:reverse] [animation-duration:1.5s]"></div>
            <i class="fa-solid fa-atom text-teal-400 text-lg animate-pulse"></i>
        </div>
        <div class="flex flex-col items-center gap-1 text-center">
            <h4 class="text-sm font-extrabold uppercase tracking-widest bg-clip-text text-transparent bg-gradient-to-r from-teal-400 to-emerald-400 font-mono">Baking Quantized Stream</h4>
            <p id="overlay-status-label" class="text-[11px] text-slate-500 font-mono">Down-sampling image array matrix...</p>
        </div>
    </div>

    <footer class="mt-auto border-t border-slate-900/60 bg-slate-950/40 py-4 px-6 text-center text-xs text-slate-600 shrink-0">
        &copy; 2026 FusionMint Workspace. Local sandbox optimization runtime block.
    </footer>

    <script src="../../assets/js/imageProcessCore/compress-image.js"> </script>
</body>
</html>
