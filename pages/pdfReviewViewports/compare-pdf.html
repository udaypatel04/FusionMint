<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare PDF Core // FusionMint Laboratory</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <link rel="stylesheet" href="../../assets/css/pdfReviewViewports/compare-pdf.css">
    
</head>
<body class="no-scrollbar text-slate-200 min-h-screen flex flex-col overflow-hidden pt-16">

    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-64 bg-gradient-to-b from-blue-500/5 to-transparent blur-3xl pointer-events-none"></div>

    <div class="fixed top-0 left-0 right-0 z-50 px-6 py-3.5 bg-slate-950/60 backdrop-blur-xl border-b border-slate-900 shadow-2xl">
        <nav class="w-full max-w-7xl mx-auto flex items-center justify-between">
            
            <div class="flex items-center gap-2.5 group cursor-pointer w-1/4">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-500 to-indigo-400 flex items-center justify-center shadow-md shadow-blue-500/20 group-hover:rotate-180 transition-transform duration-700">
                    <i class="fa-solid fa-atom text-slate-950 text-xs animate-spin [animation-duration:16s]"></i>
                </div>
                <span class="text-sm font-bold text-white tracking-tight">Fusion<span class="text-blue-400">Mint</span></span>
            </div>
            
            <div class="flex justify-center w-2/4">
                <div class="flex items-center gap-1 bg-slate-900/40 p-1 rounded-xl border border-slate-800/40 shadow-inner">
                    <a href="../../index.html" class="px-4 py-1.5 text-xs font-medium text-slate-400 hover:text-white rounded-lg transition-colors">Home</a>
                    <a href="../../index.html#library" class="px-3 py-1.5 text-xs font-semibold text-teal-400 bg-teal-500/10 rounded-lg border border-teal-500/10 transition-all">Tools</a>
                    <a href="../navBar/about.html" class="px-4 py-1.5 text-xs font-medium text-slate-400 hover:text-white rounded-lg transition-colors">About</a>
                 </div>
            </div>

            <div class="flex justify-end items-center gap-3 w-1/4">
                <button id="btn-fullscreen-presentation" disabled onclick="toggleFullscreenPresentation()" class="hidden px-3 py-1.5 text-xs font-bold uppercase tracking-wider bg-gradient-to-r from-blue-500 to-indigo-500 hover:from-blue-400 hover:to-indigo-400 text-slate-950 rounded-xl shadow-lg transition-all cursor-pointer flex items-center gap-1.5 animate-fade-in">
                    <i class="fa-solid fa-expand text-[11px]"></i> Launch Presentation Mode
                </button>
                <div id="badge-workspace" class="flex items-center gap-1.5 text-[10px] font-medium text-slate-400 bg-slate-900/80 px-2.5 py-1.5 rounded-xl border border-slate-800/60">
                    <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span>
                    <span>Active</span>
                </div>
            </div>

        </nav>
    </div>

    <main id="split-workspace-grid" class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-4 p-4 overflow-hidden items-stretch relative z-10 transition-all duration-300">
        
        <div id="panel-container-a" class="flex flex-col bg-slate-950/40 border border-slate-900/80 rounded-2xl p-4 overflow-hidden workspace-glow relative group">
            <div class="flex items-center justify-between mb-3 shrink-0 gap-4 min-h-[44px]">
                <div class="flex items-center gap-2 max-w-[42%] shrink-0">
                    <span id="lbl-file-a" class="text-[10px] font-mono uppercase font-bold tracking-widest text-blue-400 bg-blue-500/5 px-3 py-2.5 rounded-xl border border-blue-500/10 truncate flex items-center">
                        <i class="fa-solid fa-file-circle-minus mr-1.5 opacity-70"></i> Monitor A Source
                    </span>
                    <button id="btn-remove-a" onclick="removeLoadedPdf('A')" class="hidden w-7 h-7 bg-red-500/10 border border-red-500/20 rounded-lg text-red-400 hover:bg-red-500 hover:text-slate-950 flex items-center justify-center transition-all cursor-pointer"><i class="fa-solid fa-xmark text-xs"></i></button>
                </div>
                
                <div id="controls-a" class="hidden items-center gap-2 text-xs font-mono animate-fade-in shrink-0">
                    <div class="flex items-center bg-slate-900/80 border border-slate-800 rounded-xl p-1 gap-1">
                        <button onclick="zoomViewport('A', -0.25, null)" title="Zoom Out" class="w-7 h-7 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 flex items-center justify-center transition-colors cursor-pointer"><i class="fa-solid fa-minus text-[10px]"></i></button>
                        <span id="lbl-zoom-a" class="text-[11px] font-bold text-slate-300 min-w-[34px] text-center">100%</span>
                        <button onclick="zoomViewport('A', 0.25, null)" title="Zoom In" class="w-7 h-7 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 flex items-center justify-center transition-colors cursor-pointer"><i class="fa-solid fa-plus text-[10px]"></i></button>
                        
                        <div class="w-px h-4 bg-slate-800 mx-0.5"></div>

                        <button onclick="turnPage('A', -1)" title="Previous Page" class="w-7 h-7 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 flex items-center justify-center transition-colors cursor-pointer"><i class="fa-solid fa-chevron-left text-[10px]"></i></button>
                        
                        <div class="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded-lg border border-slate-800/80">
                            <input type="number" id="input-jump-page-a" value="1" min="1" onkeydown="handlePageJumpKeydown(event, 'A')" class="w-7 bg-transparent text-center font-bold text-blue-400 focus:outline-none text-[11px] [appearance:none] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                            <span id="lbl-total-pages-a" class="text-[10px] font-medium text-slate-500">/ 1</span>
                        </div>
                        
                        <button onclick="turnPage('A', 1)" title="Next Page" class="w-7 h-7 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 flex items-center justify-center transition-colors cursor-pointer"><i class="fa-solid fa-chevron-right text-[10px]"></i></button>
                    </div>
                </div>
            </div>

            <div class="flex-1 overflow-hidden relative rounded-xl border border-slate-900/80">
                <div id="drop-zone-a" class="absolute inset-0 border border-dashed border-slate-800 hover:border-blue-500/30 rounded-xl flex flex-col items-center justify-center p-6 text-center group cursor-pointer transition-all z-20 bg-slate-950/20">
                    <input type="file" id="input-a" accept="application/pdf" onchange="stageFile(this, 'A')" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-blue-500/5 border border-blue-500/10 text-blue-400 flex items-center justify-center text-lg mb-3 group-hover:scale-110 transition-transform duration-300">
                        <i class="fa-solid fa-file-invoice"></i>
                    </div>
                    <p class="text-xs font-bold text-slate-300 group-hover:text-white transition-colors">Mount Target PDF Document A</p>
                </div>

                <button id="floating-prev-a" onclick="turnPage('A', -1)" class="hidden absolute left-3 top-1/2 -translate-y-1/2 z-30 w-11 h-11 rounded-full bg-slate-950/70 border border-slate-800/80 text-blue-400 shadow-2xl backdrop-blur-md items-center justify-center hover:bg-blue-500 hover:text-slate-950 hover:scale-105 transition-all cursor-pointer">
                    <i class="fa-solid fa-chevron-left text-sm"></i>
                </button>
                <button id="floating-next-a" onclick="turnPage('A', 1)" class="hidden absolute right-3 top-1/2 -translate-y-1/2 z-30 w-11 h-11 rounded-full bg-slate-950/70 border border-slate-800/80 text-blue-400 shadow-2xl backdrop-blur-md items-center justify-center hover:bg-blue-500 hover:text-slate-950 hover:scale-105 transition-all cursor-pointer">
                    <i class="fa-solid fa-chevron-right text-sm"></i>
                </button>

                <div id="scroll-box-a" class="zoom-scroll-box no-scrollbar hidden">
                    <div class="min-w-full min-h-full flex items-center justify-center p-8">
                        <div id="wrapper-a" class="canvas-wrapper">
                            <canvas id="canvas-compare-a"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="panel-container-b" class="flex flex-col bg-slate-950/40 border border-slate-900/80 rounded-2xl p-4 overflow-hidden workspace-glow relative group">
            <div class="flex items-center justify-between mb-3 shrink-0 gap-4 min-h-[44px]">
                <div class="flex items-center gap-2 max-w-[42%] shrink-0">
                    <span id="lbl-file-b" class="text-[10px] font-mono uppercase font-bold tracking-widest text-teal-400 bg-teal-500/5 px-3 py-2.5 rounded-xl border border-teal-500/10 truncate flex items-center">
                        <i class="fa-solid fa-file-signature mr-1.5 opacity-70"></i> Monitor B Variant
                    </span>
                    <button id="btn-remove-b" onclick="removeLoadedPdf('B')" class="hidden w-7 h-7 bg-red-500/10 border border-red-500/20 rounded-lg text-red-400 hover:bg-red-500 hover:text-slate-950 flex items-center justify-center transition-all cursor-pointer"><i class="fa-solid fa-xmark text-xs"></i></button>
                </div>
                
                <div id="controls-b" class="hidden items-center gap-2 text-xs font-mono animate-fade-in shrink-0">
                    <div class="flex items-center bg-slate-900/80 border border-slate-800 rounded-xl p-1 gap-1">
                        <button onclick="zoomViewport('B', -0.25, null)" title="Zoom Out" class="w-7 h-7 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 flex items-center justify-center transition-colors cursor-pointer"><i class="fa-solid fa-minus text-[10px]"></i></button>
                        <span id="lbl-zoom-b" class="text-[11px] font-bold text-slate-300 min-w-[34px] text-center">100%</span>
                        <button onclick="zoomViewport('B', 0.25, null)" title="Zoom In" class="w-7 h-7 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 flex items-center justify-center transition-colors cursor-pointer"><i class="fa-solid fa-plus text-[10px]"></i></button>
                        
                        <div class="w-px h-4 bg-slate-800 mx-0.5"></div>

                        <button onclick="turnPage('B', -1)" title="Previous Page" class="w-7 h-7 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 flex items-center justify-center transition-colors cursor-pointer"><i class="fa-solid fa-chevron-left text-[10px]"></i></button>
                        
                        <div class="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded-lg border border-slate-800/80">
                            <input type="number" id="input-jump-page-b" value="1" min="1" onkeydown="handlePageJumpKeydown(event, 'B')" class="w-7 bg-transparent text-center font-bold text-teal-400 focus:outline-none text-[11px] [appearance:none] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                            <span id="lbl-total-pages-b" class="text-[10px] font-medium text-slate-500">/ 1</span>
                        </div>
                        
                        <button onclick="turnPage('B', 1)" title="Next Page" class="w-7 h-7 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 flex items-center justify-center transition-colors cursor-pointer"><i class="fa-solid fa-chevron-right text-[10px]"></i></button>
                    </div>
                </div>
            </div>

            <div class="flex-1 overflow-hidden relative rounded-xl border border-slate-900/80">
                <div id="drop-zone-b" class="absolute inset-0 border border-dashed border-teal-500/40 rounded-xl flex flex-col items-center justify-center p-6 text-center group cursor-pointer transition-all z-20 bg-slate-950/20">
                    <input type="file" id="input-b" accept="application/pdf" onchange="stageFile(this, 'B')" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-teal-500/5 border border-teal-500/10 text-teal-400 flex items-center justify-center text-lg mb-3 group-hover:scale-110 transition-transform duration-300">
                        <i class="fa-solid fa-file-invoice"></i>
                    </div>
                    <p class="text-xs font-bold text-slate-300 group-hover:text-white transition-colors">Mount Target PDF Document B</p>
                </div>

                <button id="floating-prev-b" onclick="turnPage('B', -1)" class="hidden absolute left-3 top-1/2 -translate-y-1/2 z-30 w-11 h-11 rounded-full bg-slate-950/70 border border-slate-800/80 text-teal-400 shadow-2xl backdrop-blur-md items-center justify-center hover:bg-teal-500 hover:text-teal-400 hover:scale-105 transition-all cursor-pointer">
                    <i class="fa-solid fa-chevron-left text-sm"></i>
                </button>
                <button id="floating-next-b" onclick="turnPage('B', 1)" class="hidden absolute right-3 top-1/2 -translate-y-1/2 z-30 w-11 h-11 rounded-full bg-slate-950/70 border border-slate-800/80 text-teal-400 shadow-2xl backdrop-blur-md items-center justify-center hover:bg-teal-500 hover:text-teal-400 hover:scale-105 transition-all cursor-pointer">
                    <i class="fa-solid fa-chevron-right text-sm"></i>
                </button>

                <div id="scroll-box-b" class="zoom-scroll-box no-scrollbar hidden">
                    <div class="min-w-full min-h-full flex items-center justify-center p-8">
                        <div id="wrapper-b" class="canvas-wrapper">
                            <canvas id="canvas-compare-b"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>
    <script src="../../assets/js/commonJS/mobile-device-hide-page.js"></script>
    <script src="../../assets/js/pdfReviewViewports/compare-pdf.js"></script>
</body>
</html>
